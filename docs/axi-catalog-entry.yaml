# DRAFT catalog entry for kunchenguid/axi `catalog.yaml`, `community` list.
#
# This file is a draft, not a submission. Nothing here has been sent to
# kunchenguid/axi. The owner submits it (the PR is public).
#
# In kunchenguid/axi, `catalog.yaml` is the single source of truth: the README
# and docs tables are generated from it, and `docs:check` fails on a
# hand-edited generated region. No CI, tag or release action in this repo
# follows from this file; that PR is the whole task.
#
# Steps the owner runs:
#   1. Fork kunchenguid/axi and branch from its main.
#   2. Append the `- name: llm-extract-axi` entry below (without these comments)
#      to the `community` list in catalog.yaml.
#   3. Refresh `reviewed_revision` to the release commit (see note below).
#   4. Run `pnpm run docs:gen` to regenerate README.md and docs/index.html, and
#      commit all three files (catalog.yaml, README.md, docs/index.html)
#      together (CI `docs:check` fails on drift).
#   5. Push through the `no-mistakes` gate (`no-mistakes init --fork-url
#      git@github.com:<you>/axi.git`, then `git push no-mistakes`; v1.30.1 or
#      newer for forks). It runs the pipeline and opens the PR.
#
# `reviewed_revision` is the commit docs/axi-audit.md was made against
# (196d678, PR #80's merge commit on `main`: the commit the v2.1.1 tag
# carries). Every pointer and probe in the audit was re-checked there, with
# the v2.1.1 binary built from it.
# Unreleased changes on `main` after the tag moved seven extract_relevant.go
# lines; the audit cites them where `main` has them and lists their v2.1.1
# lines in its Audited note.
# If a later release moves the pin, re-check docs/axi-audit.md there and
# replace both; TestAXIAuditPointersLandOnTheirSymbols and
# TestAXICatalogEntryReviewsTheAuditedRevision fail when they drift apart.
#
# The MCP server (cmd/llm-extract-mcp, internal/extract/mcpserver) is out of
# scope of the audit and of reviewed_components: it shells out to the CLI and
# holds no logic of its own.
#
# The token number is quoted from benchmarks/README.md (4240 raw-page tokens
# vs 1432 `extract-links --axi` tokens on one 15,411-byte fixture page = 3.0x).
# If that file changes, re-quote it here.
- name: llm-extract-axi
  url: https://github.com/samestrin/llm-extract-axi
  author: samestrin
  domain: Extraction
  description: "Fetches a web page or file and returns only the ranked links or the passages relevant to a given context; on a 15 KB documentation page, `extract-links --axi` printed 3.0x fewer tokens than the page itself (1,432 vs 4,240, offline benchmark, no model call)."
  admission:
    status: exception
    reviewed_revision: 196d6787640cf1da67d1639bec31b21fe0c2f3c8
    reviewed_components:
      - README.md
      - docs/axi-audit.md
      - docs/output.md
      - benchmarks/README.md
      - cmd/llm-extract/main.go
      - pkg/output/axi.go
      - pkg/output/exit.go
      - internal/extract/commands/root.go
      - internal/extract/commands/fetch.go
      - internal/extract/commands/extract_links.go
      - internal/extract/commands/extract_relevant.go
      - internal/extract/commands/setup.go
      - internal/extract/commands/setup_codex.go
      - internal/extract/commands/setup_opencode.go
      - internal/extract/commands/completion.go
    source_observations:
      - "docs/axi-audit.md marks principles 2, 4, 5, 8 and 10 as met: extract-links rows default to 4 fields (href, text, score, section) with --fields to pick others; extract-links and extract-relevant always report a total, and an extract-relevant directory run reads only regular text files inside --path, skips dotfiles and credential names, and counts what it skipped by reason; an empty success carries total 0 and a message (no links found, no relevant content found) while a failure carries an error (a failed extract-links --context ranking keeps the unranked links and their total beside it); a bare run prints the binary path, the network/model reach table and the live configuration with no network or model call; --help exits 0 on the root and all five subcommands, and fetch, extract-links, extract-relevant and setup --help each include an Examples section of runnable invocations."
      - "TOON is the default output on the home view, fetch, extract-links, extract-relevant and setup, help[] next steps included (fetch carries help[] when its body is cut or not text), on success, on an empty result and on an error; a failed fetch's help[] names the fix for that failure (check the URL on a 4xx, --retries on a 5xx, a browser for a challenge page, --max-bytes over the cap) before the usage line. --plain prints human-readable text (--axi=false is the same; --axi stays an accepted no-op alias), --json carries no help[], and --plain with --json is a usage error. A suggested command carries none of a page-controlled link, URL or path on any platform; it names the result field that holds it (--path <links[0].href>)."
      - "Every error is on stdout in the active format with stderr empty: a TOON error/message/help[] document by default, one {error, message} JSON document under --json, an Error: line under --plain (an error carried inside a result, such as a failed --context ranking beside its links, prints as that result's ERROR: line); a failed fetch included. A mid-run failure keeps the partial result and still exits non-zero: unranked heuristic links after a failed --context ranking, and '<n> of <total> files failed' for a partial extract-relevant directory run. A failed model call prints no secret from OPENAI_BASE_URL: its password and key-, token-, secret- or signature-named query values are REDACTED. With extract-relevant -o FILE, stdout is still one structured document: the result without the passages (they are in the file), or the error document on a failed TOON run. On a usage error the format is read from the command line the way pflag reads it: --plain (or --axi=false) over --json over the TOON default; the last occurrence of each flag sets it, and --axi, a no-op alias, never undoes an earlier --json."
      - "A malformed invocation (unknown command or unknown flag) exits 2 with a structured error in the active format, before any network or model call; this is the go-axi usage-error convention (goaxi.ExitUsage, pkg/output/exit.go), not an exception."
      - "llm-extract setup registers Claude Code (a SessionStart hook in .claude/settings.json and an Agent Skill in .claude/skills/llm-extract/SKILL.md), Codex (a SessionStart hook in .codex/hooks.json) and OpenCode (a V2 plugin in .opencode/plugins/llm-extract.js that adds the home view to each session) by default; --target picks a subset. It keeps other settings, is idempotent, repairs the hooks after the binary moves, has --dry-run and writes nothing outside the project directory: a --dir that is the home directory or does not exist is refused (exit 2), and so is a .claude, .codex, .opencode or settings file that is a symlink leading outside --dir, before anything is written. Its result is a TOON document (written[], unchanged[], dry_run, help[]). Nothing prompts."
      - "fetch prints a TOON envelope by default: url, final_url, status, tier, format, content_type, bytes (the whole-body size), truncated and body (the first 4096 bytes, cut on a character boundary); when cut, help[] names --full and --output <file>. --head N sets the cut, --full returns the whole body, --plain prints body bytes alone (a cut puts a one-line size hint on stderr), --json prints the same capped document as JSON, --output FILE saves the whole raw body and leaves body out (a path that cannot be written exits 2 before the request), and --fields selects envelope fields (an unknown field exits 2; --fields with --plain exits 2). A non-text or non-UTF-8 body gets an empty body, truncated true and help[] to --output. The download cap (--max-bytes / FETCH_MAX_BYTES, default 16 MiB) is unchanged: a larger body is an error with no partial output; the same cap, set by FETCH_MAX_BYTES (--max-bytes is fetch's flag only), covers extract-links and the extract-relevant page fetch."
      - "benchmarks/README.md: on one committed 15,411-byte documentation page served on loopback, extract-links --axi in heuristic mode printed 1432 tokens against 4240 for the raw page (3.0x). The counts are a lower bound from cl100k_base's split pattern; tiktoken gave 2.97 on the same output with both cl100k_base and o200k_base. Every count is committed in benchmarks/results-tokens.json, and a test fails when a run of the counter, benchmarks/README.md or this entry disagrees with it. One page is one data point, not an average."
      - "The model-call paths of extract-links --context and extract-relevant were not probed end to end (no LLM endpoint on the build host); their failure and output shapes are covered by fake-endpoint tests."
    exception: "Two stated exceptions, named by principle as in docs/axi-audit.md. Principle 3, exception (2) there: the model commands cut their model input at a fixed limit and say so in a truncated note — extract-relevant (each prompt cut at 30,000 bytes) and extract-links --context (the first 100 links, in a prompt cut at 25,000 bytes). It is an input limit on what the model reads, not output truncation, and the model commands have no --full; fetch's own output cut has a bytes size hint and --full. Principle 7: no session-end hook; the tool keeps no session state. Also under principle 7: the Agent Skill is a hand-written constant that CI checks against the committed SKILL.md rather than a file generated from the home view (which is live state), and setup writes no Codex [features].hooks = true, because Codex runs hooks by default."
